name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # Job 1: Testes antes do deploy
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run import tests
        run: python -c "from backend.server import app; print('Backend imports OK')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  # Job 2: Deploy para produção
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VM_ID }}
          username: root
          key: ${{ secrets.HOSTINGER_API_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 Iniciando deploy..."
            
            cd /root/TeacherApp || cd ~/TeacherApp
            
            echo "📥 Atualizando código..."
            git fetch --all
            git reset --hard origin/main
            
            echo "🛑 Parando containers antigos..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            echo "🧹 Limpando imagens não utilizadas..."
            docker image prune -f || true
            
            echo "🔨 Buildando e iniciando containers..."
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            
            echo "⏳ Aguardando banco de dados..."
            sleep 10
            
            echo "🗄️ Executando migrações..."
            docker compose -f docker-compose.prod.yml exec -T backend python3 database/migrate.py || echo "Migrações já aplicadas ou erro não crítico"
            
            echo "✅ Verificando status dos containers..."
            docker compose -f docker-compose.prod.yml ps
            
            echo "🎉 Deploy concluído com sucesso!"
